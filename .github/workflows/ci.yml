name: CI

on:
  pull_request:
  push:
    branches: [main]

# Pushing again to a PR should replace the in-flight run rather than queue
# behind it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      # Report every version that breaks, not just the first.
      fail-fast: false
      matrix:
        # Matches package.json engines. sharp's prebuilt binaries require
        # Node >=20.9, so 18 cannot work however much we might want it to.
        node: ['20', '22', '24']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      # The editor tests drive a real Firefox, which the runner image already
      # has. Two things they need are not on it:
      #
      #   * xauth — `xvfb-run` shells out to it and exits immediately without
      #     it, so the browser never starts and the only symptom is a test
      #     waiting for a page that was never opened.
      #   * mesa's software rasteriser — a headless runner has no GPU, and this
      #     is the difference between the GL tests exercising the renderer and
      #     quietly taking their own no-WebGL branch.
      #
      # x11-utils is for xdpyinfo, so "is there a usable display" is answered
      # rather than inferred from a missing command.
      - name: install a headless display and a software GL stack
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xauth x11-utils libgl1-mesa-dri

      # The unit tests deliberately avoid ImageMagick — they cover the things
      # that fail *silently* (DDS header maths, mip chain lengths, ZIP
      # integrity, UV rect validation) and none of those need the encoder.
      #
      # LIVERYKIT_REQUIRE_BROWSER turns "no browser, so skip" into a failure.
      # Locally a skip is right; here it would mean the editor tests silently
      # stopped running and nobody found out, because a skip prints a green tick.
      - run: npm test
        env:
          LIVERYKIT_REQUIRE_BROWSER: '1'

  build:
    name: build a livery end to end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # ImageMagick does the DDS encoding, and it is a subprocess, so no unit
      # test reaches it. Fonts matter too: librsvg silently substitutes a
      # missing face, and the text comes out a different width with no warning.
      - name: install ImageMagick and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends imagemagick fonts-dejavu-core

      - run: npm ci

      - name: build the example livery
        run: node bin/liverykit.mjs neon-grid --out dist

      # The portability claim, checked rather than asserted. The same design
      # file on a Formula car and a road car, which between everything painted
      # share exactly one texture filename. Both profiles are in the repo, so
      # this needs no game content.
      - name: build the portable livery on two unrelated cars
        run: |
          node bin/liverykit.mjs neon-grid-any --profile cars/rss_formula_rss_4.json --out dist-rss
          node bin/liverykit.mjs neon-grid-any --profile cars/abarth500.json --out dist-abarth
          python3 - <<'PY'
          import glob, sys
          rss = {f.split('/')[-1] for f in glob.glob('dist-rss/neon_grid_any/*')}
          ab  = {f.split('/')[-1] for f in glob.glob('dist-abarth/neon_grid_any/*')}
          if not rss or not ab:
              sys.exit('one of the cars produced nothing')
          # ui_skin.json and preview.jpg are ours; the textures are the cars'.
          # livery.png is the Content Manager thumbnail we write, not a car texture.
          ours = {'ui_skin.json', 'preview.jpg', 'livery.png'}
          shared = (rss & ab) - ours
          print(f'RSS4 {len(rss - ours)} textures, Abarth {len(ab - ours)}, shared names: {sorted(shared)}')
          if len(shared) > 1:
              sys.exit(f'expected at most ac_crew.dds in common, got {sorted(shared)}')
          PY

      # The encoder's failure modes are quiet: a wrong mip count or a DX10
      # header produces a file that installs cleanly and renders wrong. Checking
      # the bytes is the only way to notice in CI.
      - name: verify the encoded output
        run: |
          test -f dist/neon_grid.zip
          unzip -l dist/neon_grid.zip
          python3 - <<'PY'
          import glob, math, struct, sys

          files = sorted(glob.glob('dist/neon_grid/*.dds'))
          if not files:
              sys.exit('no DDS files were produced')

          # A truncated file should be reported as truncated, not raise
          # struct.error and bury the real problem in a traceback.
          HEADER = 128

          problems = []
          for path in files:
              with open(path, 'rb') as fh:
                  head = fh.read(HEADER)
              if len(head) < HEADER:
                  problems.append(f'{path}: truncated — {len(head)} bytes, need {HEADER}')
                  continue
              if head[:4] != b'DDS ':
                  problems.append(f'{path}: not a DDS')
                  continue
              _, _, height, width, _, _, mips = struct.unpack_from('<7I', head, 4)
              fourcc = head[84:88].decode('ascii', 'replace')
              expected = int(math.log2(max(width, height))) + 1
              if fourcc == 'DX10':
                  problems.append(f'{path}: DX10 header — AC is DX9 and ignores these')
              if fourcc not in ('DXT1', 'DXT5'):
                  problems.append(f'{path}: unexpected format {fourcc!r}')
              if mips != expected:
                  problems.append(f'{path}: {mips} mip levels, expected {expected}')
              print(f'  ok {path} {width}x{height} {fourcc} mips={mips}')

          print(f'{len(files)} DDS files checked')
          if problems:
              sys.exit('\n'.join(problems))
          PY
